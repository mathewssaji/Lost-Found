<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Campus Catalog | Campus Lost & Found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- Navbar -->
  <header class="fixed top-0 left-0 right-0 z-40 glass-nav border-b border-slate-200/80 dark:border-slate-800/80">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-400 flex items-center justify-center text-white shadow-md">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
        </div>
        <div>
          <span class="font-display font-bold text-lg text-slate-900 dark:text-white">CampusMatch</span>
          <p class="text-[10px] text-slate-400 -mt-0.5">Campus Catalog Search</p>
        </div>
      </a>

      <nav class="flex items-center gap-2">
        <a href="/" class="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Dashboard</a>
        <a href="/browse" class="px-3.5 py-2 text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50/80 dark:bg-indigo-950/50 rounded-lg">Browse Catalog</a>
        <a href="/matcher" class="px-3.5 py-2 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg">Visual Matcher</a>
      </nav>
    </div>
  </header>

  <main class="flex-grow pt-24 pb-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      
      <!-- Page Header -->
      <div class="mb-8">
        <h1 class="font-display text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Explore Campus Items</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Filter across lost or found property reported across university zones.</p>
      </div>

      <!-- Advanced Filter Toolbar -->
      <div class="bg-white dark:bg-slate-800 rounded-2xl p-5 border border-slate-200 dark:border-slate-700 shadow-xs mb-8 space-y-4">
        <div class="flex flex-wrap items-center gap-3 justify-between">
          
          <!-- Filter Buttons -->
          <div class="flex items-center gap-1.5 p-1 bg-slate-100 dark:bg-slate-900 rounded-xl">
            <button class="filter-btn px-4 py-2 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-xs" data-filter="ALL">All Items</button>
            <button class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300" data-filter="LOST">Lost Only</button>
            <button class="filter-btn px-4 py-2 rounded-lg text-xs font-semibold text-slate-600 dark:text-slate-300" data-filter="FOUND">Found Only</button>
          </div>

          <!-- Search Input -->
          <div class="relative flex-1 min-w-[240px] max-w-md">
            <svg class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            <input type="text" id="catalog-search" placeholder="Type title, brand, student name..." class="w-full pl-10 pr-4 py-2 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 focus:ring-2 focus:ring-indigo-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-3 border-t border-slate-100 dark:border-slate-700/60">
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Filter By Category</label>
            <select id="filter-category" class="category-dropdown w-full px-3.5 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200" data-is-filter="true">
              <option value="">All Categories</option>
            </select>
          </div>
          <div>
            <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">Filter By Campus Zone / Building</label>
            <select id="filter-location" class="location-dropdown w-full px-3.5 py-2.5 rounded-xl text-xs bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200" data-is-filter="true">
              <option value="">All Locations</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Items Grid -->
      <div class="flex items-center justify-between mb-4">
        <h2 class="font-display text-base font-bold text-slate-900 dark:text-white">Catalog Results</h2>
        <span id="filtered-count" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300">0 items</span>
      </div>

      <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
        <!-- Populated dynamically -->
      </div>

    </div>
  </main>

  <!-- Detail Modal -->
  <div id="detail-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeItemDetail()"></div>
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="relative w-full max-w-2xl bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
        <button onclick="closeItemDetail()" class="absolute top-4 right-4 p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
        <div id="detail-modal-content"></div>
      </div>
    </div>
  </div>

  <!-- Contact Modal -->
  <div id="contact-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm" onclick="closeContactModal()"></div>
    <div class="flex min-h-full items-center justify-center p-4">
      <div class="relative w-full max-w-md bg-white dark:bg-slate-800 rounded-3xl p-6 shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
        <div class="w-14 h-14 mx-auto mb-4 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-600 dark:text-emerald-300 flex items-center justify-center">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h3 class="font-display text-lg font-bold text-slate-900 dark:text-white">Item Claimed & Reunited!</h3>
        <p id="contact-item-title" class="text-xs text-slate-500 mt-1 font-medium"></p>
        <div class="mt-5 p-4 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 text-left">
          <p class="text-[11px] font-semibold text-slate-400 uppercase">Reporter Contact Name</p>
          <p id="contact-name-val" class="text-sm font-bold text-slate-800 dark:text-slate-100 mt-0.5"></p>
          <p class="text-[11px] font-semibold text-slate-400 uppercase mt-3">Direct Contact Channel</p>
          <p id="contact-info-val" class="text-sm font-bold text-indigo-600 dark:text-indigo-400 mt-0.5 break-all"></p>
        </div>
        <button onclick="closeContactModal()" class="w-full mt-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md">
          Close Window
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-5 py-3.5 rounded-xl shadow-2xl text-white font-medium transition-all duration-300 transform translate-y-10 opacity-0 pointer-events-none bg-slate-800">
    <span id="toast-icon">✓</span>
    <span id="toast-msg">Notification</span>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
